services:
  - type: web
    name: movie-worker
    env: node
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg python3
      pip3 install yt-dlp || curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && chmod a+rx /usr/local/bin/yt-dlp
      npm install
    startCommand: node server.js
